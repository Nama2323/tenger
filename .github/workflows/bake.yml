name: Bake frames

# Prepares the challenge targets from the IRSA archive and stores the frames in the repository.
# Manual runs only: the weekly schedule was removed so no automatic rebake can overwrite static/data
# (the TENGER investigations, trials and scoreboard) during judging. A manual run still rebuilds
# static/data with the older SPHEREx Blink pipeline; see docs/RELEASE.md before running it.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Restore downloaded frames
        uses: actions/cache/restore@v4
        with:
          path: data
          key: frames-${{ github.run_id }}
          restore-keys: frames-
      - name: Bake
        env:
          BLINK_CACHE: data
          BLINK_WORKERS: "10"
        run: python -m scripts.bake
      - name: Keep downloaded frames for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: frames-${{ github.run_id }}
      - name: Build static site data
        env:
          BLINK_CACHE: data
        run: |
          python -m scripts.sky_tiles static/data/sky
          python -m scripts.write_targets static/data
          python -m scripts.build_site static/data
          node scripts/results.mjs static/data
      - name: Store frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/data
          git diff --cached --quiet || git commit -m "chore: update baked frames"
          git pull --rebase --autostash origin main
          git push
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
