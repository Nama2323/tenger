<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vestigium caption</title>
<!-- One burned-in caption (tasks B9, B21), drawn on a transparent 1280x720 page in the site's font; text from ?t=. -->
<link rel="stylesheet" href="../../../../static/css/style.css">
<style>
  html, body { width: 1280px; height: 720px; overflow: hidden; background: transparent !important; }
  body { display: grid; align-items: end; justify-items: center; }
  #box {
    box-sizing: border-box; max-width: 1180px; margin: 0 0 30px; padding: 12px 26px 14px;
    background: rgba(5, 7, 13, 0.86); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 12px;
    color: #fff; font: 600 34px/1.3 var(--font-text); text-align: center; letter-spacing: 0; text-wrap: balance;
  }
</style>
</head>
<body>
  <p id="box"></p>
  <script>
    const params = new URLSearchParams(location.search);
    // pos=top (task B26): the caption at the top, where a shot's cursor works near the bottom of the picture.
    if (params.get('pos') === 'top') { document.body.style.alignItems = 'start'; document.getElementById('box').style.margin = '70px 0 0'; }
    const words = params.get('t').split(' ');
    const box = document.getElementById('box');
    words.forEach((word, index) => {
      const span = document.createElement('span');
      span.textContent = word;
      box.append(span, index < words.length - 1 ? ' ' : '');
    });
  </script>
</body>
</html>
