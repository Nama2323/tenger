<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TENGER title card</title>
<!-- The 30-second video's last shot (task B9): the site's own stylesheet, fonts and dark background, plain text. -->
<link rel="stylesheet" href="../../../../static/css/style.css">
<style>
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { display: grid; place-items: center; background: var(--bg); }
  .card { display: grid; gap: 22px; justify-items: center; text-align: center; }
  .card .brand-mark { width: 84px; height: 84px; color: var(--accent); }
  .card .brand-moon { fill: var(--star); }
  .card h1 { font: 700 64px/1.05 var(--font-head); letter-spacing: -0.01em; color: var(--text); }
  .card .url { font: 600 30px/1.2 var(--font-mono); color: var(--accent); }
  .card .team { font: 500 24px/1.4 var(--font-text); color: var(--text); max-width: 1100px; }
  .card .data { font: 400 21px/1.4 var(--font-text); color: var(--muted); }
</style>
</head>
<body>
  <div class="card">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <ellipse cx="16" cy="16" rx="14" ry="6.5" transform="rotate(-24 16 16)" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.7"/>
      <circle cx="16" cy="16" r="5" fill="currentColor"/>
      <circle cx="28.2" cy="10.6" r="2.2" class="brand-moon"/>
    </svg>
    <h1>TENGER: Predict the Sky</h1>
    <p class="url">nama2323.github.io/tenger</p>
    <p class="team">Narmandakh Garam, Erkhes Orgil, Anu-Ujin Bayarbaatar, Sonomlegtsog Zolzaya</p>
    <p class="data">Data: NASA SPHEREx via NASA/IPAC IRSA</p>
  </div>
</body>
</html>
