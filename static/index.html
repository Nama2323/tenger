<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TENGER</title>
  <meta name="description" content="See real changes in the infrared sky. Make a prediction. Check it against NASA SPHEREx observations.">
  <link rel="icon" href="data:,">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=tenger-b4">
</head>
<body data-page="home">
  <a class="skip" href="#main" data-t="site.skip"></a>
  <canvas id="starfield" class="starfield" aria-hidden="true"></canvas>

  <header class="topbar">
    <a id="logo" class="brand" href="./" data-page-link="home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <ellipse cx="16" cy="16" rx="14" ry="6.5" transform="rotate(-24 16 16)" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.7"/>
        <circle cx="16" cy="16" r="5" fill="currentColor"/>
        <circle cx="28.2" cy="10.6" r="2.2" class="brand-moon"/>
      </svg>
      <span data-t="site.title"></span>
    </a>
    <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-t="nav.menu"></button>
    <nav id="site-nav" class="nav" data-t-label="nav.label">
      <button type="button" data-page-link="home" data-t="nav.home"></button>
      <button type="button" data-page-link="predictions" data-t="nav.predictions"></button>
      <button type="button" data-page-link="game" data-t="nav.game"></button>
      <button type="button" data-page-link="learn" data-t="nav.learn"></button>
      <button type="button" data-page-link="about" data-t="nav.about"></button>
      <button type="button" class="nav-extra" data-dialog="limits" aria-haspopup="dialog" data-t="limits.button"></button>
    </nav>
    <button id="shortcuts-open" type="button" class="icon-button" data-dialog="shortcuts" aria-haspopup="dialog" data-t="keys.symbol" data-t-label="keys.button"></button>
  </header>

  <div id="example-banner" class="example-banner" role="note" hidden>
    <p data-t="example.short"></p>
    <a id="example-exit" href="./" data-t="example.exit"></a>
  </div>
  <p id="caption" class="caption" hidden aria-live="polite"></p>
  <div id="tour-bar" class="caption tour-bar" role="region" data-t-label="tour.label" hidden>
    <p id="tour-text" aria-live="polite"></p>
    <button id="tour-stop" type="button" data-t="tour.stop"></button>
  </div>

  <main id="main" tabindex="-1">
    <div id="notices" class="notices" aria-live="polite"></div>
    <!-- ======================= Home / Investigate ======================= -->
    <section id="page-home" class="page page-home" aria-labelledby="home-title">
      <h1 id="home-title" class="sr-only" tabindex="-1" data-t="home.title"></h1>
      <div class="scene">
        <div class="map-stage">
          <div id="map-canvas" class="map-canvas" role="group" data-t-label="map.label" hidden></div>
          <p id="map-waiting" class="map-waiting glass" data-t="map.waiting"></p>
        </div>
        <p class="map-caption glass" data-t="map.caption"></p>
        <details id="map-key" class="map-key glass">
          <summary data-t="map.legend"></summary>
          <ul id="map-legend" class="legend" hidden>
            <li class="colour-star"><i class="dot" aria-hidden="true"></i><span data-t="map.legend.star"></span></li>
            <li class="colour-variable"><i class="dot" aria-hidden="true"></i><span data-t="map.legend.variable"></span></li>
            <li class="colour-solar"><i class="dot" aria-hidden="true"></i><span data-t="map.legend.solar"></span></li>
            <li class="colour-hypothetical"><i class="dot" aria-hidden="true"></i><span data-t="map.legend.hypothetical"></span></li>
          </ul>
          <p class="note" data-t="map.scale"></p>
          <div id="map-notes" class="note"></div>
        </details>
      </div>

      <div class="console-left">
        <div class="search-card glass">
          <p class="search-lead" data-t="site.tagline"></p>
          <form id="search" class="search" aria-labelledby="search-title">
            <h2 id="search-title" class="sr-only" data-t="search.title"></h2>
            <div class="search-line">
              <label class="sr-only" for="search-input" data-t="searchLabel"></label>
              <input id="search-input" type="text" autocomplete="off" spellcheck="false" aria-describedby="search-help search-message" data-t-placeholder="searchPlaceholder">
              <label class="sr-only" for="search-fov" data-t="search.fov"></label>
              <select id="search-fov"></select>
              <button type="submit" class="primary" data-t="search.go"></button>
            </div>
            <p id="search-help" class="hint" data-t="search.help"></p>
            <div id="search-list" class="search-list" hidden></div>
            <p id="search-message" class="form-message" aria-live="polite"></p>
            <div class="search-tools">
              <button id="top-places" type="button" class="quiet" data-t="topPlaces"></button>
              <button id="sky-open" type="button" class="quiet" aria-expanded="false" aria-controls="sky-panel" data-t="sky.openButton"></button>
              <button id="tour-start" type="button" class="quiet" data-t="tour.start"></button>
            </div>
          </form>
          <section class="shortcuts" aria-labelledby="shortcuts-title">
            <h2 id="shortcuts-title" class="eyebrow" data-t="shortcuts.title"></h2>
            <ul id="shortcut-list" class="chips"></ul>
          </section>
        </div>

        <aside id="rail" class="rail glass" aria-labelledby="rail-title">
          <button id="rail-toggle" class="rail-toggle" type="button" aria-expanded="true" aria-controls="rail-body">
            <span id="rail-title" data-t="rail.title"></span>
            <span id="rail-count" class="rail-count"></span>
          </button>
          <div id="rail-body" class="rail-body">
            <p class="note" data-t="feed.lead"></p>
            <div id="feed-list" class="rail-groups"></div>
            <p class="rail-credit" data-t="footer.credit"></p>
          </div>
        </aside>
      </div>

      <section id="sky-panel" class="sky-panel glass" hidden aria-labelledby="sky-title">
        <div class="sky-head">
          <h2 id="sky-title" data-t="sky.title"></h2>
          <button id="sky-close" type="button" class="quiet" data-t="sky.close"></button>
        </div>
        <p class="note" data-t="sky.lead"></p>
        <div id="sky" class="sky"></div>
        <p id="sky-message" class="form-message" aria-live="polite"></p>
        <p class="note" data-t="ack.aladin"></p>
      </section>
    </section>

    <!-- ======================= Investigation ======================= -->
    <section id="page-investigate" class="page page-investigate" hidden aria-labelledby="object-name">
      <header class="inv-head">
        <div class="inv-head-actions">
          <button id="inv-back" type="button" class="quiet" data-t="inv.back"></button>
          <button id="share" type="button" class="quiet" data-t="inv.share"></button>
        </div>
        <div class="object">
          <p id="object-kind" class="object-kind eyebrow"></p>
          <h1 id="object-name" tabindex="-1"></h1>
          <p id="object-coords" class="object-coords mono"></p>
          <p id="object-status" class="stamps"></p>
          <span id="share-status" class="note" role="status"></span>
        </div>
      </header>

      <div id="observatory" class="stage" data-mode="blink">
        <section class="stage-view" data-t-label="viewer.label">
          <div id="plates" class="plates" data-mode="blink">
            <div id="frame-a" class="plate-frame">
              <canvas id="plate" width="1600" height="1600" tabindex="0" data-t-label="viewer.label"></canvas>
              <p id="plate-date" class="plate-date"></p>
              <p id="lock" class="lock" hidden></p>
              <p id="plate-empty" class="plate-empty" hidden></p>
              <p class="plate-hint" data-t="zoomHint"></p>
            </div>
            <div id="second-frame" class="plate-frame plate-b" hidden>
              <canvas id="plate-b" width="1600" height="1600"></canvas>
              <p id="plate-date-b" class="plate-date"></p>
              <i id="swipe-line" class="swipe-line" aria-hidden="true"></i>
            </div>
          </div>
        </section>
        <label id="swipe-control" class="swipe-control" hidden><span data-t="swipe.label"></span>
          <input id="swipe" type="range" min="0" max="100" step="1" value="50">
        </label>
        <div class="timebar glass" role="group" data-t-label="timebar.label">
          <div class="timebar-track">
            <button id="play" type="button" class="primary play-button"></button>
            <div id="dates" class="film" role="group" data-t-label="caption.time"></div>
          </div>
          <div class="timebar-controls">
            <div class="segment" role="group" id="modes" data-t-label="mode.label">
              <button type="button" data-mode="blink" data-t="mode.blink"></button>
              <button type="button" data-mode="swipe" data-t="mode.swipe"></button>
              <button type="button" data-mode="side" data-t="mode.side"></button>
              <button type="button" data-mode="diff" data-t="mode.diff"></button>
            </div>
            <p id="explain" class="explain" aria-live="polite"></p>
          </div>
          <p id="diff-note" class="note warn" hidden data-t="mode.diffOff"></p>
        </div>
      </div>

      <div id="inv-panel" class="inv-panel">
        <nav class="panel-nav" data-t-label="panel.nav">
          <button type="button" data-panel="see" data-t="panel.see"></button>
          <button type="button" data-panel="changed" data-t="panel.changed"></button>
          <button type="button" data-panel="prediction" data-t="panel.prediction"></button>
          <button type="button" data-panel="evidence" data-t="panel.evidence"></button>
          <button type="button" data-panel="spectrum" data-t="panel.spectrum"></button>
        </nav>

        <section id="panel-see" class="panel panel-see" aria-labelledby="h-see">
          <h2 id="h-see" class="panel-title" data-t="panel.see"></h2>
          <p id="progress" class="progress" role="status"></p>
          <p id="see-empty" class="panel-note" hidden></p>
          <div id="see-tools" class="see-tools">
            <section id="caption-strip" class="caption-strip" aria-labelledby="caption-title">
              <h3 id="caption-title" data-t="caption.title"></h3>
              <div id="caption-body"></div>
            </section>
            <div class="ab" role="group" data-t-label="ab.label">
              <label class="ab-pick"><span class="ab-letter" data-t="ab.a"></span><select id="range-from"></select></label>
              <label class="ab-pick"><span class="ab-letter" data-t="ab.b"></span><select id="range-to"></select></label>
              <div class="ab-buttons">
                <button id="swap" type="button" data-t="ab.swap"></button>
                <button id="endpoints" type="button" data-t="ab.only"></button>
              </div>
            </div>
            <section class="wavelength" aria-labelledby="wavelength-title">
              <h3 id="wavelength-title" data-t="caption.wavelength"></h3>
              <div class="bands">
                <button id="composite" type="button" data-t="composite"></button>
                <output id="band-label" class="mono"></output>
                <div class="band-track">
                  <div id="band-scale" class="band-scale" aria-hidden="true"></div>
                  <input id="band" type="range" min="0" max="101" step="1" value="0" data-t-label="bandSlider">
                </div>
              </div>
              <div id="arrays" class="arrays" role="group" data-t-label="arrays.label"></div>
            </section>
            <details id="more" class="more">
              <summary data-t="viewer.more"></summary>
              <div class="tools">
                <label class="tool"><span data-t="fieldOfView"></span><select id="fov"></select></label>
                <label class="tool"><span data-t="toolSpeed"></span>
                  <select id="speed">
                    <option value="1500" data-t="speedSlow"></option>
                    <option value="900" selected data-t="speedNormal"></option>
                    <option value="350" data-t="speedFast"></option>
                  </select>
                </label>
                <label class="tool wide"><span data-t="toolContrast"></span>
                  <input id="contrast" type="range" min="0.4" max="4" step="0.1" value="1">
                </label>
                <label class="tool check"><input id="negative" type="checkbox"><span data-t="toolNegative"></span></label>
                <label class="tool check"><input id="gaia" type="checkbox"><span data-t="gaia"></span></label>
                <label class="tool check"><input id="wise" type="checkbox"><span data-t="wise"></span></label>
                <label class="tool check"><input id="flags" type="checkbox"><span data-t="excludeFlags"></span></label>
              </div>
              <div class="try">
                <button id="follow" type="button" class="try-main" aria-pressed="false"></button>
                <button id="fullscreen" type="button" data-t="toolFullscreen"></button>
                <button id="save-image" type="button" data-t="toolSave"></button>
              </div>
              <div id="chooser" class="chooser" hidden>
                <strong data-t="chooseTitle"></strong>
                <div id="chooser-list" class="chooser-list"></div>
                <button id="chooser-close" type="button" class="quiet" data-t="cancel"></button>
              </div>
            </details>
            <p class="note" data-t="viewer.keys"></p>
            <p class="note"><span id="plate-info"></span></p>
          </div>
        </section>

        <section id="panel-changed" class="panel" aria-labelledby="h-changed">
          <h2 id="h-changed" class="panel-title" data-t="panel.changed"></h2>
          <p class="lead" data-t="changed.lead"></p>
          <div id="changed-validated"></div>
          <section id="explore-box" class="explore-box" aria-labelledby="h-explore">
            <h3 id="h-explore" data-t="changed.explore"></h3>
            <p class="note" data-t="changed.exploreLead"></p>
            <div class="explore-grid">
              <div>
                <h4 data-t="changed.motionTitle"></h4>
                <div id="motion-result" class="motion-result"></div>
                <button id="measure" type="button" data-t="measure"></button>
              </div>
              <div>
                <h4 data-t="changed.curveTitle"></h4>
                <div id="curve-chart" class="chart"></div>
                <p id="curve-note" class="note"></p>
                <div id="curve-table"></div>
              </div>
            </div>
          </section>
        </section>

        <section id="panel-prediction" class="panel" aria-labelledby="h-prediction">
          <h2 id="h-prediction" class="panel-title" data-t="panel.prediction"></h2>
          <p class="lead" data-t="pred.lead"></p>
          <div id="prediction-body"></div>
        </section>

        <section id="panel-evidence" class="panel" aria-labelledby="h-evidence">
          <h2 id="h-evidence" class="panel-title" data-t="panel.evidence"></h2>
          <p class="lead" data-t="evidence.lead"></p>
          <div id="evidence-body"></div>
        </section>

        <section id="panel-spectrum" class="panel" aria-labelledby="h-spectrum">
          <h2 id="h-spectrum" class="panel-title" data-t="panel.spectrumOptional"></h2>
          <p class="lead" data-t="spectrum.lead"></p>
          <div id="spectrum-note"></div>
          <div id="chart" class="chart"></div>
          <p id="chart-note" class="note"></p>
          <p class="note" data-t="spectrum.features"></p>
          <div id="spectrum-table"></div>
        </section>
      </div>
    </section>

    <!-- ======================= Predictions ======================= -->
    <section id="page-predictions" class="page page-predictions" hidden aria-labelledby="predictions-title">
      <header class="page-head">
        <p class="eyebrow" data-t="ledger.eyebrow"></p>
        <h1 id="predictions-title" tabindex="-1" data-t="ledger.title"></h1>
        <p class="lead" data-t="ledger.lead"></p>
      </header>
      <div id="ledger-source" class="ledger-source" role="note" hidden></div>
      <section id="ledger-board" class="ledger-board glass" aria-labelledby="ledger-board-title"></section>
      <section class="ledger-section" aria-labelledby="ledger-trials-title">
        <h2 id="ledger-trials-title" data-t="ledger.trialsTitle"></h2>
        <p class="note" data-t="ledger.trialsLead"></p>
        <div id="ledger-list" class="ledger-list"></div>
      </section>
      <section class="ledger-section" aria-labelledby="ledger-forecasts-title">
        <h2 id="ledger-forecasts-title" data-t="ledger.forecastsTitle"></h2>
        <p class="note" data-t="ledger.forecastsLead"></p>
        <div id="ledger-forecast-list" class="ledger-list"></div>
      </section>
      <section id="ledger-seeonly-wrap" class="ledger-section" aria-labelledby="ledger-seeonly-title" hidden>
        <h2 id="ledger-seeonly-title" data-t="ledger.seeOnlyTitle"></h2>
        <div id="ledger-seeonly" class="ledger-list"></div>
      </section>
    </section>

    <!-- ======================= Beat the physics ======================= -->
    <section id="page-game" class="page page-game" hidden aria-labelledby="game-title">
      <header class="page-head">
        <p class="eyebrow" data-t="game.eyebrow"></p>
        <h1 id="game-title" tabindex="-1" data-t="game.title"></h1>
        <p class="lead" data-t="game.lead"></p>
        <p class="note" data-t="game.scoring"></p>
      </header>
      <div id="game-rounds" class="game-rounds"></div>
    </section>

    <!-- ======================= Learn ======================= -->
    <section id="page-learn" class="page page-learn" hidden aria-labelledby="learn-title">
      <header class="page-head">
        <p class="eyebrow" data-t="learn.eyebrow"></p>
        <h1 id="learn-title" tabindex="-1" data-t="learn.title"></h1>
        <p class="lead" data-t="learn.lead"></p>
      </header>
      <div id="learn-index" class="learn-index">
      <ul id="lesson-list" class="cards-list lessons"></ul>
      <article id="lab" class="page-card lab glass" aria-labelledby="lab-title">
        <svg class="lab-orbit" viewBox="0 0 120 60" aria-hidden="true" focusable="false">
          <ellipse cx="60" cy="30" rx="56" ry="20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="3 4"/>
          <circle cx="60" cy="30" r="4" class="lab-sun"/>
          <circle cx="114" cy="26" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2 2"/>
        </svg>
        <div class="lab-words">
          <h2 id="lab-title" data-t="lab.title"></h2>
          <p data-t="lab.text"></p>
          <p><button id="lab-open" type="button" class="primary" data-t="lab.open"></button></p>
        </div>
      </article>
      </div>
      <article id="lesson-view" class="lesson glass" hidden aria-labelledby="lesson-title"></article>
      <section id="lab-view" class="lab-view glass" hidden aria-labelledby="lab-view-title"></section>
    </section>

    <!-- ======================= About ======================= -->
    <section id="page-about" class="page page-about" hidden aria-labelledby="about-title">
      <header class="page-head">
        <p class="eyebrow" data-t="about.eyebrow"></p>
        <h1 id="about-title" tabindex="-1" data-t="about.title"></h1>
        <p class="lead" data-t="about.what"></p>
      </header>
      <div class="about-grid">
        <section class="about-card glass" aria-labelledby="about-data-title">
          <h2 id="about-data-title" data-t="about.dataTitle"></h2>
          <ul id="about-data"></ul>
        </section>
        <section class="about-card glass" aria-labelledby="about-methods-title">
          <h2 id="about-methods-title" data-t="about.methodsTitle"></h2>
          <ul id="about-methods"></ul>
        </section>
        <section class="about-card glass about-wide" aria-labelledby="about-credits-title">
          <h2 id="about-credits-title" data-t="about.creditsTitle"></h2>
          <ul id="about-credits"></ul>
          <p class="note" data-t="about.license"></p>
        </section>
        <section class="about-card glass" aria-labelledby="about-fonts-title">
          <h2 id="about-fonts-title" data-t="about.fontsTitle"></h2>
          <ul id="about-fonts" class="font-list"></ul>
          <p class="note" data-t="font.selfHosted"></p>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p data-t="footer.credit"></p>
    <p data-t="footer.base"></p>
  </footer>

  <dialog id="reveal" class="reveal" aria-labelledby="reveal-title">
    <div class="reveal-shell">
      <header class="reveal-head">
        <div class="reveal-heading">
          <p id="reveal-eyebrow" class="eyebrow"></p>
          <h2 id="reveal-title"></h2>
          <p id="reveal-stamps" class="stamps"></p>
        </div>
        <button id="reveal-close" type="button" class="quiet" data-t="reveal.close"></button>
      </header>
      <div class="reveal-body">
        <figure class="reveal-figure">
          <div id="reveal-stage" class="reveal-stage" role="img"></div>
          <figcaption id="reveal-caption" class="note"></figcaption>
        </figure>
        <div class="reveal-side">
          <ol id="reveal-steps" class="reveal-progress"></ol>
          <div class="reveal-controls">
            <button id="reveal-back" type="button" data-t="reveal.back"></button>
            <button id="reveal-forward" type="button" class="primary"></button>
            <p class="hint" data-t="reveal.keys"></p>
          </div>
          <div id="reveal-text" class="reveal-text" aria-live="polite"></div>
          <div id="reveal-numbers" class="reveal-numbers"></div>
          <div id="reveal-legend"></div>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="shortcuts" class="sheet" aria-labelledby="shortcuts-title">
    <div class="sheet-box">
      <header class="sheet-head">
        <h2 id="shortcuts-title" data-t="keys.title"></h2>
        <button type="button" class="quiet" data-close data-t="dialog.close"></button>
      </header>
      <div id="shortcuts-body" class="keys-body"></div>
    </div>
  </dialog>

  <dialog id="limits" class="sheet" aria-labelledby="limits-title">
    <div class="sheet-box">
      <header class="sheet-head">
        <h2 id="limits-title" data-t="limits.title"></h2>
        <button type="button" class="quiet" data-close data-t="dialog.close"></button>
      </header>
      <p class="note" data-t="limits.lead"></p>
      <div id="limits-body" class="limits-body"></div>
    </div>
  </dialog>

  <script type="module" src="js/main.js?v=tenger-b4"></script>
</body>
</html>
